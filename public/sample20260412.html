<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Video Pixel Exporter（フレーム間隔版）</title>
  <style>body{font-family:sans-serif;max-width:900px;margin:24px auto;padding:0 16px;}
  video,canvas{max-width:100%;display:block;margin:12px 0;}
  label{display:block;margin:8px 0;}
  button{padding:8px 16px;margin:4px;cursor:pointer;}
  button:disabled{background:#ccc;cursor:not-allowed;}
  #status{margin:12px 0;padding:8px;background:#f0f8ff;border-radius:4px;}
  input{width:80px;}
  #controls{margin-top:16px;padding:12px;background:#f9f9f9;border-radius:4px;}
  .error{color:#d00;}
  </style>
</head>
<body>
  <h1>MP4 → 指定座標の画素値 → CSV（フレーム間隔）</h1>

  <input id="file" type="file" accept="video/mp4,.mp4">
  <label>X: <input id="x" type="number" value="280" min="0"></label>
  <label>Y: <input id="y" type="number" value="180" min="0"></label>
  
  <!-- ★ フレーム間隔に変更 -->
  <label>間隔(フレーム): <input id="frameInterval" type="number" value="30" min="1"></label>
  <label>FPS: <span id="fpsDisplay">-</span></label>
  <label>開始フレーム: <input id="startFrame" type="number" value="0" min="0"></label>
  <label>終了フレーム: <input id="endFrame" type="number" value="1800" min="0"></label>

  <button id="test1">1フレーム取得＋検証</button>
  <button id="extract">範囲抽出→CSV</button>
  <button id="stop" disabled>中断</button>

  <video id="video" controls muted playsinline></video>
  <canvas id="canvas" style="border:1px solid #ccc;"></canvas>
  <div id="status"></div>
  <div id="controls">
    <label><input id="showCross" type="checkbox" checked> 十字表示</label>
    <label>十字サイズ: <input id="crossSize" type="range" min="5" max="30" value="10"><span id="crossSizeVal">10px</span></label>
    <label><input id="robustMode" type="checkbox" checked> 堅牢モード</label>
    <label>ファイル: <span id="fileInfo"></span></label>
  </div>

  <script>
    const els={file:document.getElementById('file'),x:document.getElementById('x'),y:document.getElementById('y'),
      frameInterval:document.getElementById('frameInterval'),fpsDisplay:document.getElementById('fpsDisplay'),
      startFrame:document.getElementById('startFrame'),endFrame:document.getElementById('endFrame'),
      test1:document.getElementById('test1'),extract:document.getElementById('extract'),stop:document.getElementById('stop'),
      video:document.getElementById('video'),canvas:document.getElementById('canvas'),status:document.getElementById('status'),
      showCross:document.getElementById('showCross'),crossSize:document.getElementById('crossSize'),crossSizeVal:document.getElementById('crossSizeVal'),
      robustMode:document.getElementById('robustMode'),fileInfo:document.getElementById('fileInfo')};
    const ctx=els.canvas.getContext('2d',{willReadFrequently:true});
    let objectUrl=null,isExtracting=false;

    els.file.addEventListener('change',()=>{
      if(objectUrl)URL.revokeObjectURL(objectUrl);
      const file=els.file.files[0];
      if(!file) return;
      objectUrl=URL.createObjectURL(file);
      els.video.src=objectUrl;
      els.fileInfo.textContent=`${file.name} (${(file.size/1024/1024).toFixed(1)}MB)`;
      updateStatus(`動画読み込み中: ${file.name}`);
    });

    // FPS表示更新
    els.video.addEventListener('loadedmetadata',()=>{
      const fps=Math.round(els.video.playbackRate*100)/100 || 30;
      els.fpsDisplay.textContent=fps;
      const totalFrames=Math.floor(els.video.duration*fps);
      els.endFrame.value=totalFrames;
      updateStatus(`総フレーム数: ${totalFrames} (${els.video.duration.toFixed(1)}秒)`);
    });

    function drawCross(x,y,size,color='red'){
      ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x-size,y);ctx.lineTo(x+size,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y-size);ctx.lineTo(x,y+size);ctx.stroke();
      ctx.fillStyle=color;ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(`(${Math.floor(x)},${Math.floor(y)})`,x,y+size+20);
    }

    function redrawCross(){
      const x=Number(els.x.value),y=Number(els.y.value);
      if(els.video.videoWidth){
        ctx.clearRect(0,0,els.canvas.width,els.canvas.height);
        ctx.drawImage(els.video,0,0);
        if(els.showCross.checked) drawCross(x,y,Number(els.crossSize.value));
      }
    }

    els.x.addEventListener('input',redrawCross);els.y.addEventListener('input',redrawCross);
    els.showCross.addEventListener('change',redrawCross);
    els.crossSize.addEventListener('input',()=>{els.crossSizeVal.textContent=els.crossSize.value+'px';redrawCross();});

    function updateStatus(msg,className=''){
      els.status.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
      els.status.className=className;
      console.log(msg);
    }

    async function waitVideoReady(){
      return new Promise(r=>{if(els.video.readyState>=2)return r();els.video.addEventListener('loadeddata',r,{once:true});});
    }

    // ★ フレーム番号→時間変換
    function frameToTime(frame,fps){
      return frame / fps;
    }

    async function getFramePixelSafely(targetFrame,x,y){
      const fps=els.video.playbackRate || 30;
      const targetTime=frameToTime(targetFrame,fps);
      return new Promise(async (resolve,reject)=>{
        els.video.currentTime=targetTime;
        await new Promise((r,reject)=>{
          const timeout=Date.now()+3000;
          const checkSeeked=()=>{
            if(els.video.readyState>=2 && Math.abs(els.video.currentTime-targetTime)<0.03) return r();
            if(Date.now()>timeout) return reject('seek timeout');
            requestAnimationFrame(checkSeeked);
          };
          requestAnimationFrame(checkSeeked);
        });
        if(els.robustMode.checked) await new Promise(r=>setTimeout(r,50));
        els.canvas.width=els.video.videoWidth;
        els.canvas.height=els.video.videoHeight;
        ctx.drawImage(els.video,0,0);
        const data=ctx.getImageData(Math.floor(x),Math.floor(y),1,1).data;
        resolve([data[0],data[1],data[2],data[3]]);
      });
    }

    els.test1.addEventListener('click',async()=>{
      if(!els.file.files[0]){updateStatus('ファイルを選択','error');return;}
      const x=Number(els.x.value),y=Number(els.y.value);
      await new Promise(r=>setTimeout(r,100));
      const w=els.video.videoWidth,h=els.video.videoHeight;
      if(x>=w||y>=h||x<0||y<0){updateStatus(`座標エラー: ${w}x${h}`,'error');return;}
      try{
        updateStatus('1フレーム取得中...');
